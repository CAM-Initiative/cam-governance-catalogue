name = "vigil-case-file-challenges"
main = "index.mjs"
compatibility_date = "2026-10-09"

# Non-secret configuration only. This MUST point to an existing PRIVATE repo.
[vars]
SITE_ORIGIN = "https://www.cam-initiative.org"
GITHUB_OWNER = "CAM-Initiative"
GITHUB_REPO = "vigil-observatory"

# The deployment must fail if either secret is absent.
[secrets]
required = ["GITHUB_TOKEN", "TURNSTILE_SECRET"]

# Soft per-location limit: up to 5 POST attempts per minute per visitor IP.
# Cloudflare's native rate-limit binding is configured via Wrangler deployment.
[[ratelimits]]
name = "CHALLENGE_RATE_LIMITER"
namespace_id = "26091001"

  [ratelimits.simple]
  limit = 5
  period = 60
