name: Rebuild GitHub Pages output

on:
  push:
    # Build source changes on feature branches as well as main so PRs carry current /docs output.
    branches:
      - "**"
    paths:
      - "src/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "vite.config.ts"
      - "scripts/prepare-github-pages.js"
      - "scripts/sync-cam-governance.mjs"
      - "scripts/sync-vigil-records.mjs"
      - "scripts/test-vigil-observatory.mjs"
      - ".github/workflows/publish-pages-output.yml"
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: pages-output-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rebuild-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Validate CAM website palette
        run: pnpm run validate:palette

      - name: Test public VIGIL surface contract
        run: node --test scripts/test-vigil-public-surfaces.mjs

      - name: Refresh public governance registries
        env:
          VIGIL_FEATURE_REGISTRY: https://raw.githubusercontent.com/CAM-Initiative/Vigil/chore/remove-aeon-governance-lab-public-references/vigil/VIGIL.Incidents.Index.json
        run: |
          pnpm run sync:cam
          if [ "$GITHUB_REF_NAME" = "ux/taxonomy-evidence-legibility" ]; then
            VIGIL_REGISTRY_SOURCE="$VIGIL_FEATURE_REGISTRY" VIGIL_RECORD_BRANCH="chore/remove-aeon-governance-lab-public-references" pnpm run sync:vigil
          else
            pnpm run sync:vigil
          fi

      - name: Rebuild published site
        env:
          VIGIL_FEATURE_REGISTRY: https://raw.githubusercontent.com/CAM-Initiative/Vigil/chore/remove-aeon-governance-lab-public-references/vigil/VIGIL.Incidents.Index.json
        run: |
          rm -rf docs/assets
          if [ "$GITHUB_REF_NAME" = "ux/taxonomy-evidence-legibility" ]; then
            VITE_VIGIL_REGISTRY_URL="$VIGIL_FEATURE_REGISTRY" VITE_VIGIL_RECORD_BRANCH="chore/remove-aeon-governance-lab-public-references" pnpm exec vite build
          else
            pnpm exec vite build
          fi
          node scripts/prepare-github-pages.js

      - name: Validate generated Pages output
        run: python scripts/validate-docs-published-output.py --base HEAD~1

      - name: Test VIGIL Observatory
        run: pnpm run test:vigil

      - name: Commit rebuilt docs output
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Published /docs output is already current."
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            # The complete validation suite above has already run against the
            # exact generated output being committed. Skip automatic CI on the
            # bot commit to avoid an un-runnable pull_request check owned by the bot.
            git commit -m "chore: rebuild GitHub Pages output [skip ci]"
            git push
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Mark generated head as validated
        if: steps.publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          GENERATED_SHA="$(git rev-parse HEAD)"
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/statuses/${GENERATED_SHA}" \
            -f state=success \
            -f context='pages-output/validated' \
            -f description='Generated Pages output passed publication and VIGIL validation'
