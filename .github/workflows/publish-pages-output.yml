name: Rebuild GitHub Pages output

on:
  push:
    # Build source changes on feature branches as well as main so PRs carry current /docs output.
    branches:
      - "**"
    paths:
      - "src/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "vite.config.ts"
      - "scripts/prepare-github-pages.js"
      - "scripts/migrate-vigil-references-v7.mjs"
      - ".github/workflows/publish-pages-output.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-output-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rebuild-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply References v7 source migration
        run: node scripts/migrate-vigil-references-v7.mjs

      - name: Test VIGIL Observatory
        run: pnpm run test:vigil

      - name: Test VIGIL Knowledge Base contract
        run: pnpm run test:knowledge-base

      - name: Validate CAM website palette
        run: pnpm run validate:palette

      - name: Rebuild published site
        run: |
          rm -rf docs/assets
          pnpm exec vite build
          node scripts/prepare-github-pages.js

      - name: Validate generated Pages output
        run: python scripts/validate-docs-published-output.py --base HEAD~1

      - name: Commit migrated source and rebuilt docs output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs src/pages/vigil-case-file.tsx src/pages/evidence-chain-report.tsx src/vigil-ux-v4.css src/public/vigil-ux-enhancements.js scripts/test-vigil-observatory.mjs
          if git diff --cached --quiet; then
            echo "Source migration and published /docs output are already current."
          else
            git commit -m "refactor: make References canonical section 07 [skip ci]"
            git push
          fi
