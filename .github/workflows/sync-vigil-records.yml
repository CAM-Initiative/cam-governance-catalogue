name: Sync VIGIL records

on:
  workflow_dispatch:
  # VIGIL dispatches this event after its generated registers are rebuilt.
  # The cross-repository token trigger is the canonical automatic sync path.
  repository_dispatch:
    types: [vigil-records-updated]
  # Safety-net polling: the source repo's cross-repository dispatch token can
  # expire independently of canonical VIGIL validation and taxonomy publication.
  schedule:
    - cron: "17 */6 * * *"

# Share the Pages publication lock: only one workflow may commit docs at a time.
concurrency:
  group: pages-output-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync VIGIL generated registers
        run: pnpm run sync:vigil
        env:
          VIGIL_SYNC_STRICT: "1"

      - name: Build CAM interface for GitHub Pages
        env:
          VITE_ADSENSE_CLIENT_ID: ${{ vars.VITE_ADSENSE_CLIENT_ID }}
          VITE_ADSENSE_SLOT: ${{ vars.VITE_ADSENSE_SLOT }}
          VITE_ADSENSE_ENABLED: ${{ vars.VITE_ADSENSE_ENABLED }}
        run: pnpm run deploy:docs

      - name: Commit changed generated files
        run: |
          if [ -z "$(git status --porcelain -- docs)" ]; then
            echo "No generated file changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "chore: sync VIGIL registers"
          git push
