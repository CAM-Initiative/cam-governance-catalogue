name: Temporary align Incident severity UX

on:
  push:
    branches:
      - agent/incident-severity-ux-refinement
    paths:
      - ".github/workflows/temporary-align-incident-severity-ux.yml"

permissions:
  contents: write

jobs:
  align:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/incident-severity-ux-refinement
          persist-credentials: true
          fetch-depth: 0

      - name: Align Case File severity diagnosis with structured VIGIL fields
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f"Expected block not found: {label}")
              return text.replace(old, new, 1)

          severity_fn_old = '''function severityDisplay(value?: string) {
            const raw = value?.trim();
            if (!raw) return "Not assessed";
            const code = raw.toUpperCase();
            const labels: Record<string, string> = {
              S0: "Critical",
              S1: "High",
              S2: "Moderate",
              S3: "Low",
              S4: "Negligible",
              SU: "To be assessed",
            };
            return labels[code] ? `${code} · ${labels[code]}` : titleizeValue(raw);
          }
          '''
          severity_fn_new = '''function severityDisplay(value?: string) {
            const raw = value?.trim();
            if (!raw) return "Not assessed";
            const code = raw.toUpperCase();
            const labels: Record<string, string> = {
              S1: "Critical",
              S2: "High",
              S3: "Moderate",
              S4: "Low",
              SU: "Unassessed",
            };
            return labels[code] ? `${code} · ${labels[code]}` : titleizeValue(raw);
          }
          '''

          case_path = Path("src/pages/vigil-case-file.tsx")
          case = case_path.read_text(encoding="utf-8")
          case = replace_once(case, severity_fn_old, severity_fn_new, "Case File severity labels")
          case = replace_once(
              case,
              '''  const severityBasis = failure ? firstText(failure.raw, ["severity_assessment.assessment_basis"]) : undefined;
                const severityAssessedOn = failure ? firstText(failure.raw, ["severity_assessment.assessed_on"]) : undefined;
              ''',
              '''  const severityStatus = failure ? firstText(failure.raw, ["severity_assessment.assessment_status"]) : undefined;
                const severityMaterialisedConsequence = failure ? firstText(failure.raw, ["severity_assessment.materialised_consequence"]) : undefined;
                const severityAffectedScope = failure ? firstText(failure.raw, ["severity_assessment.affected_scope"]) : undefined;
                const severitySeriousnessPersistence = failure ? firstText(failure.raw, ["severity_assessment.seriousness_and_persistence"]) : undefined;
                const severityQuantitativeInformation = failure ? firstText(failure.raw, ["severity_assessment.quantitative_information"]) : undefined;
                const severityEvidentiaryLimits = failure ? firstText(failure.raw, ["severity_assessment.evidentiary_limits"]) : undefined;
                const severityBandRationale = failure ? firstText(failure.raw, ["severity_assessment.band_rationale"]) : undefined;
                const severityAssessedOn = failure ? firstText(failure.raw, ["severity_assessment.assessed_on"]) : undefined;
              ''',
              "Case File structured severity fields",
          )
          case = replace_once(
              case,
              '<CaseTaxonomyClassification failureId={failure.id} raw={failure.raw} severityLabel={severityDisplay(failure.severity)} />',
              '<CaseTaxonomyClassification failureId={failure.id} raw={failure.raw} />',
              "Case File classification severity prop",
          )
          start = case.index('    if (stageId === "diagnose") return <>')
          end = case.index('    if (stageId === "references")', start)
          diagnose = '''    if (stageId === "diagnose") return <>
              {(failure || governanceAssessment) ? <article className="vigil-diagnosis-view">
                {failure && <div className="vigil-diagnosis-mechanism">
                  <section className="vigil-diagnosis-definition">
                    <p className="vigil-library-kicker">VIGIL governance assessment</p>
                    <p>{governanceAssessment ?? failure.publicDisplay.finding ?? failure.summary}</p>
                  </section>

                  <section className="vigil-severity-assessment" aria-labelledby="severity-assessment-heading">
                    <div className="vigil-case-subheading">
                      <p className="vigil-library-kicker">Occurrence-level severity</p>
                      <h3 id="severity-assessment-heading">Materialised consequence and supported harm in this Incident</h3>
                    </div>
                    <div className="vigil-severity-summary-grid">
                      <article>
                        <dl>
                          <Field label="Severity" value={severityDisplay(failure.severity)} />
                          <Field label="Assessment status" value={severityStatus ? titleizeValue(severityStatus) : undefined} />
                          <Field label="Assessed" value={severityAssessedOn} mono />
                        </dl>
                      </article>
                    </div>
                    <div className="vigil-severity-analysis-grid">
                      <section><p className="vigil-diagnostic-meta-label">Materialised consequence</p><p>{severityMaterialisedConsequence ?? "A structured materialised-consequence statement is not yet published for this Incident."}</p></section>
                      <section><p className="vigil-diagnostic-meta-label">Affected scope</p><p>{severityAffectedScope ?? "A structured affected-scope statement is not yet published for this Incident."}</p></section>
                      <section><p className="vigil-diagnostic-meta-label">Seriousness & persistence</p><p>{severitySeriousnessPersistence ?? "A structured seriousness-and-persistence statement is not yet published for this Incident."}</p></section>
                      <section><p className="vigil-diagnostic-meta-label">Quantitative information</p><p>{severityQuantitativeInformation ?? "No structured quantitative-information statement is yet published for this Incident."}</p></section>
                      <section><p className="vigil-diagnostic-meta-label">Evidentiary limits</p><p>{severityEvidentiaryLimits ?? "No severity-specific evidentiary-limits statement is yet published for this Incident."}</p></section>
                      <section><p className="vigil-diagnostic-meta-label">Why this severity band</p><p>{severityBandRationale ?? "A structured band-rationale statement is not yet published for this Incident."}</p></section>
                    </div>
                  </section>

                  <div className="vigil-diagnosis-analysis-layout">
                    <div className="vigil-diagnosis-reading-stack">
                      <section>
                        <p className="vigil-diagnostic-meta-label">Factual basis</p>
                        <p>{factualBasis ?? "A separate factual-basis statement is not yet published for this Incident."}</p>
                      </section>
                      <section>
                        <p className="vigil-diagnostic-meta-label">Governance significance</p>
                        <p>{governanceSignificance ?? "Governance significance is not yet separately stated in the canonical Incident."}</p>
                      </section>
                    </div>

                    <aside className="vigil-diagnosis-metadata-panel" aria-label="Diagnostic metadata">
                      <p className="vigil-diagnostic-meta-label">Diagnostic provenance</p>
                      <dl className="vigil-evidence-review-meta">
                        {diagnosticMethodLabel(diagnostic?.method) && <Field label="Method" value={diagnosticMethodLabel(diagnostic?.method)} />}
                        {(diagnostic?.aiPlatform || diagnostic?.aiModel) && <Field label="AI collaborator" value={[diagnostic.aiPlatform, diagnostic.aiModel].filter(Boolean).join(" ")} />}
                        <Field label="Diagnosed" value={diagnostic?.diagnosticDate} />
                        <Field label="Review status" value={reviewStatusLabel(diagnostic?.reviewStatus)} />
                        <Field label="Human contribution" value={diagnostic?.humanRole} />
                        <Field label="AI contribution" value={diagnostic?.aiRole} />
                        <Field label="Authority boundary" value={diagnostic?.authorityBoundary} />
                        <Field label="Model attribution" value={diagnostic?.attributionBasis} />
                      </dl>
                    </aside>
                  </div>

                  {assessmentBoundaries.length > 0 && <details className="vigil-evidence-limitations vigil-diagnosis-limitations">
                    <summary>Limits of the diagnosis</summary>
                    <div className="vigil-evidence-boundary-list"><TextList items={assessmentBoundaries} /></div>
                  </details>}
                </div>}
              </article> : <p className="vigil-case-empty">No structured governance assessment is linked yet. The investigation may still be in evidence gathering or diagnosis.</p>}
            </>;

          '''
          case = case[:start] + diagnose + case[end:]
          case_path.write_text(case, encoding="utf-8")

          report_path = Path("src/pages/evidence-chain-report-deterministic.tsx")
          report = report_path.read_text(encoding="utf-8")
          report = replace_once(report, severity_fn_old, severity_fn_new, "Report severity labels")
          report = replace_once(
              report,
              '''  const severityBasis = failure ? firstText(failure.raw, ["severity_assessment.assessment_basis"]) : undefined;
                const severityAssessedOn = failure ? firstText(failure.raw, ["severity_assessment.assessed_on"]) : undefined;
              ''',
              '''  const severityStatus = failure ? firstText(failure.raw, ["severity_assessment.assessment_status"]) : undefined;
                const severityMaterialisedConsequence = failure ? firstText(failure.raw, ["severity_assessment.materialised_consequence"]) : undefined;
                const severityAffectedScope = failure ? firstText(failure.raw, ["severity_assessment.affected_scope"]) : undefined;
                const severitySeriousnessPersistence = failure ? firstText(failure.raw, ["severity_assessment.seriousness_and_persistence"]) : undefined;
                const severityQuantitativeInformation = failure ? firstText(failure.raw, ["severity_assessment.quantitative_information"]) : undefined;
                const severityEvidentiaryLimits = failure ? firstText(failure.raw, ["severity_assessment.evidentiary_limits"]) : undefined;
                const severityBandRationale = failure ? firstText(failure.raw, ["severity_assessment.band_rationale"]) : undefined;
                const severityAssessedOn = failure ? firstText(failure.raw, ["severity_assessment.assessed_on"]) : undefined;
              ''',
              "Report structured severity fields",
          )
          start = report.index('        <Stage number="02" label="Diagnosis">')
          end = report.index('        <Stage number="03" label="Classification">', start)
          report_stage = '''        <Stage number="02" label="Diagnosis">
                  {failure ? <article className="space-y-5">
                    <section>
                      <p className="vigil-evidence-kicker">VIGIL governance assessment</p>
                      <p className="mt-2 text-base leading-relaxed text-foreground/85">{governanceAssessment ?? failure.publicDisplay.finding ?? failure.summary}</p>
                    </section>

                    <section className="report-severity-assessment rounded-lg border border-border/70 bg-[hsl(38_48%_97%)] p-4">
                      <p className="report-substantive-label">Occurrence-level severity</p>
                      <dl className="mt-3 grid gap-4 sm:grid-cols-3">
                        <Field label="Severity" value={severityDisplay(failure.severity)} />
                        <Field label="Assessment status" value={severityStatus ? titleizeValue(severityStatus) : undefined} />
                        <Field label="Assessed" value={severityAssessedOn} />
                      </dl>
                      <div className="mt-5 grid gap-4 sm:grid-cols-2">
                        <section className="rounded-lg bg-[hsl(38_48%_99%)] p-4"><p className="report-substantive-label">Materialised consequence</p><p className="mt-2 text-base leading-relaxed text-foreground/85">{severityMaterialisedConsequence ?? "A structured materialised-consequence statement is not yet published for this Incident."}</p></section>
                        <section className="rounded-lg bg-[hsl(38_48%_99%)] p-4"><p className="report-substantive-label">Affected scope</p><p className="mt-2 text-base leading-relaxed text-foreground/85">{severityAffectedScope ?? "A structured affected-scope statement is not yet published for this Incident."}</p></section>
                        <section className="rounded-lg bg-[hsl(38_48%_99%)] p-4"><p className="report-substantive-label">Seriousness & persistence</p><p className="mt-2 text-base leading-relaxed text-foreground/85">{severitySeriousnessPersistence ?? "A structured seriousness-and-persistence statement is not yet published for this Incident."}</p></section>
                        <section className="rounded-lg bg-[hsl(38_48%_99%)] p-4"><p className="report-substantive-label">Quantitative information</p><p className="mt-2 text-base leading-relaxed text-foreground/85">{severityQuantitativeInformation ?? "No structured quantitative-information statement is yet published for this Incident."}</p></section>
                        <section className="rounded-lg bg-[hsl(38_48%_99%)] p-4"><p className="report-substantive-label">Evidentiary limits</p><p className="mt-2 text-base leading-relaxed text-foreground/85">{severityEvidentiaryLimits ?? "No severity-specific evidentiary-limits statement is yet published for this Incident."}</p></section>
                        <section className="rounded-lg bg-[hsl(38_48%_99%)] p-4"><p className="report-substantive-label">Why this severity band</p><p className="mt-2 text-base leading-relaxed text-foreground/85">{severityBandRationale ?? "A structured band-rationale statement is not yet published for this Incident."}</p></section>
                      </div>
                    </section>

                    <div className="grid gap-4 lg:grid-cols-[minmax(0,1.35fr)_minmax(18rem,0.85fr)]">
                      <div className="grid gap-4">
                        <section className="rounded-lg bg-[hsl(38_48%_97%)] p-4"><p className="report-substantive-label">Factual basis</p><p className="mt-2 text-base leading-relaxed text-foreground/85">{factualBasis ?? "A separate factual-basis statement is not yet published for this Incident."}</p></section>
                        <section className="rounded-lg bg-[hsl(38_48%_97%)] p-4"><p className="report-substantive-label">Governance significance</p><p className="mt-2 text-base leading-relaxed text-foreground/85">{governanceSignificance ?? "Governance significance is not yet separately stated in the canonical Incident."}</p></section>
                      </div>
                      <aside className="rounded-lg bg-[hsl(38_48%_97%)] p-4">
                        <p className="report-label">Diagnostic provenance</p>
                        <dl className="mt-3 grid gap-4">
                          <Field label="Method" value={diagnosticMethodLabel(diagnostic?.method)} />
                          <Field label="Diagnosed" value={diagnostic?.diagnosticDate} />
                          <Field label="AI collaborator" value={[diagnostic?.aiPlatform, diagnostic?.aiModel].filter(Boolean).join(" ") || undefined} />
                          <Field label="Review status" value={diagnostic?.reviewStatus ? titleizeValue(diagnostic.reviewStatus) : undefined} />
                          <Field label="Human contribution" value={diagnostic?.humanRole} />
                          <Field label="AI contribution" value={diagnostic?.aiRole} />
                          <Field label="Authority boundary" value={diagnostic?.authorityBoundary} />
                          <Field label="Model attribution" value={diagnostic?.attributionBasis} />
                        </dl>
                      </aside>
                    </div>
                    {assessmentBoundaries.length > 0 && <details className="vigil-evidence-limitations" open>
                      <summary>Limits of the diagnosis</summary>
                      <div className="vigil-evidence-boundary-list"><TextList items={assessmentBoundaries} /></div>
                    </details>}
                  </article> : <Empty>No structured diagnosis is available.</Empty>}
                </Stage>

          '''
          report = report[:start] + report_stage + report[end:]
          report_path.write_text(report, encoding="utf-8")

          taxonomy_path = Path("src/components/vigil/CaseTaxonomyClassification.tsx")
          taxonomy = taxonomy_path.read_text(encoding="utf-8")
          taxonomy = replace_once(
              taxonomy,
              '''type Props = {
                failureId: string;
                raw: UnknownRecord;
                severityLabel: string;
              };
              ''',
              '''type Props = {
                failureId: string;
                raw: UnknownRecord;
              };
              ''',
              "Classification props",
          )
          taxonomy_path.write_text(taxonomy, encoding="utf-8")

          printable_path = Path("src/pages/evidence-chain-report-printable.tsx")
          printable = printable_path.read_text(encoding="utf-8")
          printable = replace_once(
              printable,
              '<CaseTaxonomyClassification failureId={reportFailure.id} raw={reportFailure.raw} severityLabel={reportFailure.severity ?? "Not assessed"} />',
              '<CaseTaxonomyClassification failureId={reportFailure.id} raw={reportFailure.raw} />',
              "Printable classification severity prop",
          )
          printable_path.write_text(printable, encoding="utf-8")

          css_path = Path("src/vigil-incident-severity-refinement.css")
          css_path.write_text('''/* Incident diagnosis severity refinement.
             Severity is occurrence-level substantive diagnosis, independent of taxonomy classification.
             The structured severity panel deliberately mirrors the calm card hierarchy used by Section 01 Observation. */

          .vigil-case-file-page .vigil-severity-assessment {
            margin: 0 1.25rem 1.1rem;
            border: 1px solid hsl(var(--border) / 0.72);
            border-radius: var(--vigil-case-card-radius);
            background: hsl(var(--background));
            box-shadow: var(--shadow-sm);
            overflow: hidden;
          }

          .vigil-case-file-page .vigil-severity-assessment .vigil-case-subheading {
            padding: 1.15rem var(--vigil-case-card-pad) 0.85rem;
            border: 0;
            background: transparent;
          }

          .vigil-case-file-page .vigil-severity-assessment .vigil-case-subheading h3 {
            margin: 0.22rem 0 0;
            font-size: 0.94rem;
            font-weight: 600;
            line-height: 1.45;
            color: hsl(var(--foreground) / 0.78);
          }

          .vigil-case-file-page .vigil-severity-summary-grid {
            display: grid;
            grid-template-columns: 1fr;
          }

          .vigil-case-file-page .vigil-severity-summary-grid > article {
            padding: 0.65rem var(--vigil-case-card-pad) 1.15rem;
            border: 0;
          }

          .vigil-case-file-page .vigil-severity-summary-grid dl {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 1rem 2rem;
            max-width: 64rem;
          }

          .vigil-case-file-page .vigil-severity-summary-grid .vigil-case-field:first-child dd {
            font-size: 1.05rem;
            font-weight: 650;
            color: hsl(var(--foreground) / 0.9);
          }

          .vigil-case-file-page .vigil-severity-analysis-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 1rem;
            padding: 0 1.25rem 1.25rem;
          }

          .vigil-case-file-page .vigil-severity-analysis-grid > section {
            min-width: 0;
            padding: 1.05rem 1.1rem 1.15rem;
            border-radius: 0.78rem;
            background: hsl(var(--card) / 0.33);
          }

          .vigil-case-file-page .vigil-severity-analysis-grid > section > .vigil-diagnostic-meta-label,
          .vigil-case-file-page .vigil-diagnosis-reading-stack > section > .vigil-diagnostic-meta-label {
            margin: 0 !important;
            font-family: var(--app-font-sans) !important;
            font-size: 0.8rem !important;
            font-weight: 650 !important;
            line-height: 1.35 !important;
            letter-spacing: 0.07em !important;
            text-transform: uppercase !important;
            color: hsl(var(--muted-foreground) / 0.72) !important;
          }

          .vigil-case-file-page .vigil-severity-analysis-grid > section > p:last-child,
          .vigil-case-file-page .vigil-diagnosis-reading-stack > section > p:last-child {
            margin-top: 0.52rem;
            font-size: 0.94rem;
            line-height: 1.58;
            color: hsl(var(--foreground) / 0.86);
          }

          .vigil-case-file-page .vigil-diagnosis-metadata-panel > .vigil-diagnostic-meta-label {
            margin: 0 0 0.8rem !important;
          }

          @media (max-width: 760px) {
            .vigil-case-file-page .vigil-severity-summary-grid dl,
            .vigil-case-file-page .vigil-severity-analysis-grid {
              grid-template-columns: 1fr;
            }
          }
          ''', encoding="utf-8")

          contract_path = Path("VIGIL-PUBLIC-DISPLAY-CONTRACT.md")
          contract = contract_path.read_text(encoding="utf-8")
          contract = replace_once(
              contract,
              '''- incident-level severity and its assessment status;
          - record-level evidence confidence;
          - each source's publication genre from `source_type`;
          - the taxonomy classification basis only within the classification section.
          ''',
              '''- occurrence-level severity as substantive diagnosis, including `severity`, `assessment_status`, `materialised_consequence`, `affected_scope`, `seriousness_and_persistence`, `quantitative_information`, `evidentiary_limits`, `band_rationale`, and `assessed_on` where published;
          - each source's claim-relative `evidence_status` and `evidence_status_basis` alongside its evidence metadata;
          - each source's publication genre from `source_type`;
          - the taxonomy classification basis only within the classification section; severity MUST NOT be presented as taxonomy classification.
          ''',
              "Incident public display contract",
          )
          contract_path.write_text(contract, encoding="utf-8")

          # Guard the architectural boundary in a lightweight source-level regression assertion.
          test_path = Path("scripts/test-vigil-observatory.mjs")
          test = test_path.read_text(encoding="utf-8")
          anchor = 'test("VIGIL normalization resolves canonical system and platform fields", async () => {'
          regression = '''test("Case File keeps structured Incident severity in diagnosis rather than taxonomy classification", async () => {
            const caseFile = await readFile(resolve(repoRoot, "src/pages/vigil-case-file.tsx"), "utf8");
            const taxonomy = await readFile(resolve(repoRoot, "src/components/vigil/CaseTaxonomyClassification.tsx"), "utf8");
            assert.match(caseFile, /severity_assessment\.materialised_consequence/);
            assert.match(caseFile, /severity_assessment\.affected_scope/);
            assert.match(caseFile, /severity_assessment\.seriousness_and_persistence/);
            assert.match(caseFile, /severity_assessment\.quantitative_information/);
            assert.match(caseFile, /severity_assessment\.evidentiary_limits/);
            assert.match(caseFile, /severity_assessment\.band_rationale/);
            assert.match(caseFile, /Occurrence-level severity/);
            assert.doesNotMatch(taxonomy, /severityLabel/);
          });

          '''
          if regression not in test:
              if anchor not in test:
                  raise SystemExit("Expected observatory test anchor not found")
              test = test.replace(anchor, regression + anchor, 1)
          test_path.write_text(test, encoding="utf-8")
          PY

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run VIGIL interface tests
        run: pnpm run test:vigil

      - name: Commit severity UX alignment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/pages/vigil-case-file.tsx \
            src/pages/evidence-chain-report-deterministic.tsx \
            src/pages/evidence-chain-report-printable.tsx \
            src/components/vigil/CaseTaxonomyClassification.tsx \
            src/vigil-incident-severity-refinement.css \
            scripts/test-vigil-observatory.mjs \
            VIGIL-PUBLIC-DISPLAY-CONTRACT.md
          git commit -m "feat: render structured Incident severity in diagnosis"
          git push origin HEAD:agent/incident-severity-ux-refinement
