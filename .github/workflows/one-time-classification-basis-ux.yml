name: One-time classification basis UX repair

on:
  push:
    branches:
      - agent/case-reference-bibliography-fix
    paths:
      - ".github/workflows/one-time-classification-basis-ux.yml"

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/case-reference-bibliography-fix
          persist-credentials: true
          show-progress: false
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify classification basis UX source
        run: |
          grep -q 'whatHappened?: string' src/lib/vigilPublicDisplay.ts
          grep -q 'taxonomy_classification.classification_basis' src/lib/vigilPublicDisplay.ts
          grep -q '<h4>What happened</h4>' src/components/vigil/EvidenceCard.tsx

      - name: Validate and rebuild published site
        run: |
          pnpm run validate:palette
          pnpm run test:vigil
          rm -rf docs/assets
          pnpm exec vite build
          node scripts/prepare-github-pages.js
          python scripts/validate-docs-published-output.py --base HEAD~1

      - name: Commit rebuilt docs output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "Published /docs output is already current."
          else
            git commit -m "chore: rebuild GitHub Pages output [skip ci]"
            git push
          fi
