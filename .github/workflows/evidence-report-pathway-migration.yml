name: Apply evidence report pathway migration

on:
  push:
    branches:
      - feature/vigil-knowledge-base
    paths:
      - "scripts/migrate-evidence-report-pathways.py"
      - ".github/workflows/evidence-report-pathway-migration.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/vigil-knowledge-base
          fetch-depth: 0
      - name: Apply guarded migration
        run: python scripts/migrate-evidence-report-pathways.py
      - name: Commit report update
        run: |
          if git diff --quiet -- src/pages/evidence-chain-report.tsx; then
            echo "Evidence report is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/evidence-chain-report.tsx
          git commit -m "Refine evidence report completion and provenance"
          git push origin HEAD:feature/vigil-knowledge-base
