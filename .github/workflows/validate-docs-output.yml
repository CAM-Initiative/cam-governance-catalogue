name: Validate published docs output

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-docs-output:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate CAM website palette
        run: pnpm run validate:palette

      - name: Test VIGIL Knowledge Base contract
        run: node --test scripts/test-vigil-public-surfaces.mjs

      - name: Compile website source
        run: pnpm exec vite build

      - name: Prepare GitHub Pages routes
        run: node scripts/prepare-github-pages.js

      - name: Report stale committed Pages output on pull requests
        if: github.event_name == 'pull_request'
        run: |
          if ! git diff --quiet -- docs pnpm-lock.yaml; then
            echo "::warning::Committed GitHub Pages output is stale relative to this source commit."
            echo "The source build and generated output will still be validated in this job."
            echo "The Rebuild GitHub Pages output workflow is responsible for committing the refreshed /docs bundle and marking the generated head pages-output/validated."
            git diff --stat -- docs pnpm-lock.yaml
          else
            echo "Committed GitHub Pages output already matches the current source."
          fi

      - name: Require committed Pages output to match current source on main
        if: github.event_name == 'push'
        run: |
          if ! git diff --quiet -- docs pnpm-lock.yaml; then
            echo "::error::Committed GitHub Pages output is stale relative to the current source."
            echo "The site rebuilt successfully, but the rebuild changed committed publication files."
            echo "Published main must not carry source and /docs output that disagree."
            git diff --stat -- docs pnpm-lock.yaml
            exit 1
          fi

      - name: Validate /docs publication output
        run: python scripts/validate-docs-published-output.py
        env:
          DOCS_VALIDATION_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}

      - name: Test VIGIL Observatory
        run: pnpm run test:vigil
