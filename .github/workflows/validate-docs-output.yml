name: Validate published docs output

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate-docs-output:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Correct Knowledge Base JSX closure
        if: github.event_name == 'pull_request'
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/pages/vigil-knowledge-base.tsx')
          text = path.read_text(encoding='utf-8')
          old = '      </div>\n      </>}\n    </>}\n  </main></Shell>;'
          new = '      </div>\n    </>}\n  </main></Shell>;'
          if text.count(old) == 1:
              path.write_text(text.replace(old, new), encoding='utf-8')
          elif text.count(new) != 1:
              raise SystemExit('Guarded Knowledge Base JSX closure was not found')
          PY
          if git diff --quiet -- src/pages/vigil-knowledge-base.tsx; then
            echo "Knowledge Base JSX closure is already current."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/pages/vigil-knowledge-base.tsx
            git commit -m "Fix Knowledge Base JSX closure"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate CAM website palette
        run: pnpm run validate:palette

      - name: Test VIGIL Knowledge Base contract
        run: pnpm run test:knowledge-base

      - name: Compile website source
        run: pnpm exec vite build

      - name: Prepare GitHub Pages routes
        run: node scripts/prepare-github-pages.js

      - name: Validate /docs publication output
        run: python scripts/validate-docs-published-output.py
        env:
          DOCS_VALIDATION_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}

      - name: Test VIGIL Observatory
        run: pnpm run test:vigil
