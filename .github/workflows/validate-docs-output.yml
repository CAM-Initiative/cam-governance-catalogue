name: Validate published docs output

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate-docs-output:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Apply Knowledge Base library layout
        if: github.event_name == 'pull_request'
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/knowledge-base-layout-migration.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Commit layout update"
          payload = workflow.split(start_marker, 1)[1].split(end_marker, 1)[0]
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in payload.splitlines())
          exec(compile(code, 'knowledge-base-layout-migration', 'exec'))
          PY
          if git diff --quiet -- src/pages/vigil-knowledge-base.tsx; then
            echo "Knowledge Base layout is already current."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/pages/vigil-knowledge-base.tsx
            git commit -m "Refine Knowledge Base library layout"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate CAM website palette
        run: pnpm run validate:palette

      - name: Test VIGIL Knowledge Base contract
        run: pnpm run test:knowledge-base

      - name: Compile website source
        run: pnpm exec vite build

      - name: Prepare GitHub Pages routes
        run: node scripts/prepare-github-pages.js

      - name: Validate /docs publication output
        run: python scripts/validate-docs-published-output.py
        env:
          DOCS_VALIDATION_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}

      - name: Test VIGIL Observatory
        run: pnpm run test:vigil
