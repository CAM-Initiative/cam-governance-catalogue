name: Validate published docs output

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-docs-output:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate CAM website palette
        run: pnpm run validate:palette

      - name: Test VIGIL Observatory
        run: pnpm run test:vigil

      - name: Test VIGIL Knowledge Base contract
        run: node scripts/test-vigil-knowledge-base.mjs

      - name: Compile website source
        run: pnpm exec vite build

      - name: Prepare GitHub Pages routes
        run: node scripts/prepare-github-pages.js

      - name: Validate /docs publication output
        run: python scripts/validate-docs-published-output.py
        env:
          DOCS_VALIDATION_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
