name: Validate published docs output

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-docs-output:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Reject unresolved TypeScript runtime bindings
        run: node scripts/check-runtime-bindings.mjs

      - name: Sync canonical Harm Impact methodology
        run: pnpm run sync:harm

      - name: Validate CAM website palette
        run: pnpm run validate:palette

      - name: Test VIGIL Knowledge Base contract
        run: node --test scripts/test-vigil-public-surfaces.mjs

      - name: Compile website source
        env:
          VITE_VIGIL_CHALLENGE_ENDPOINT: ${{ vars.VITE_VIGIL_CHALLENGE_ENDPOINT }}
          VITE_VIGIL_TURNSTILE_SITE_KEY: ${{ vars.VITE_VIGIL_TURNSTILE_SITE_KEY }}
          VITE_ADSENSE_CLIENT_ID: ${{ vars.VITE_ADSENSE_CLIENT_ID }}
          VITE_ADSENSE_SLOT: ${{ vars.VITE_ADSENSE_SLOT }}
          VITE_ADSENSE_ENABLED: ${{ vars.VITE_ADSENSE_ENABLED }}
        run: pnpm exec vite build

      - name: Prepare GitHub Pages routes
        run: node scripts/prepare-github-pages.js

      - name: Report stale committed Pages output on pull requests
        if: github.event_name == 'pull_request'
        run: |
          if ! git diff --quiet -- docs pnpm-lock.yaml; then
            echo "::warning::Committed GitHub Pages output is stale relative to this source commit."
            echo "The source build and generated output will still be validated in this job."
            echo "The Rebuild GitHub Pages output workflow is responsible for committing the refreshed /docs bundle and marking the generated head pages-output/validated."
            git diff --stat -- docs pnpm-lock.yaml
          else
            echo "Committed GitHub Pages output already matches the current source."
          fi

      - name: Require committed Pages output to match current source on main
        if: github.event_name == 'push'
        run: |
          if ! git diff --quiet -- docs pnpm-lock.yaml; then
            echo "::error::Committed GitHub Pages output is stale relative to the current source."
            echo "The site rebuilt successfully, but the rebuild changed committed publication files."
            echo "Published main must not carry source and /docs output that disagree."
            git diff --stat -- docs pnpm-lock.yaml
            exit 1
          fi

      - name: Validate /docs publication output
        run: python scripts/validate-docs-published-output.py
        env:
          DOCS_VALIDATION_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}

      - name: Test VIGIL Observatory
        run: pnpm run test:vigil


      - name: Run browser smoke tests against rebuilt publication
        if: github.event_name == 'pull_request'
        env:
          HEALTH_ORIGIN: http://127.0.0.1:4173
          HEALTH_EXPECTED_HTML: ${{ github.workspace }}/docs/observatory/cases/index.html
        run: |
          mkdir -p "$RUNNER_TEMP/vigil-preview"
          npm install --prefix "$RUNNER_TEMP/vigil-preview" --no-save --no-package-lock playwright@1.56.1
          "$RUNNER_TEMP/vigil-preview/node_modules/.bin/playwright" install --with-deps chromium webkit
          cp scripts/check-live-website.mjs "$RUNNER_TEMP/vigil-preview/check-live-website.mjs"
          python -m http.server 4173 --bind 127.0.0.1 --directory docs > "$RUNNER_TEMP/vigil-preview/server.log" 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          for i in {1..20}; do curl -fsS "$HEALTH_ORIGIN/" >/dev/null && break; sleep 1; done
          node "$RUNNER_TEMP/vigil-preview/check-live-website.mjs"
