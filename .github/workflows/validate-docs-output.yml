name: Validate published docs output

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate-docs-output:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Align evidence-report assertions with LEARN closure
        if: github.event_name == 'pull_request'
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/test-vigil-observatory.mjs")
          text = path.read_text(encoding="utf-8")
          replacements = {
              "assert.match(report, /A corpus PATCH or ecosystem-suggested repair grounded in existing corpus safeguards/);":
                  "assert.match(report, /The implemented corpus repair, relied-upon control, verification, and residual monitoring/);",
              "assert.match(report, /VIGIL preserves the evidence-to-repair audit trail/);":
                  "assert.match(report, /VIGIL preserves the evidence-to-repair-and-learning audit trail/);",
              "assert.match(report, /const citation = record \\? vigilCitationNumber\\(record, citations\\) : undefined/);":
                  "assert.match(report, /const citation = vigilCitationNumber\\(id, citations\\)/);",
          }

          changed = False
          for old, new in replacements.items():
              old_count = text.count(old)
              new_count = text.count(new)
              if old_count == 1 and new_count == 0:
                  text = text.replace(old, new)
                  changed = True
              elif old_count == 0 and new_count == 1:
                  continue
              else:
                  raise SystemExit(
                      f"Guarded assertion migration failed for {old!r}: old={old_count}, new={new_count}"
                  )

          if changed:
              path.write_text(text, encoding="utf-8")
          PY
          if git diff --quiet -- scripts/test-vigil-observatory.mjs; then
            echo "LEARN assertion contract is already current."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add scripts/test-vigil-observatory.mjs
            git commit -m "Update Observatory tests for LEARN closure"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate CAM website palette
        run: pnpm run validate:palette

      - name: Test VIGIL Knowledge Base contract
        run: pnpm run test:knowledge-base

      - name: Compile website source
        run: pnpm exec vite build

      - name: Prepare GitHub Pages routes
        run: node scripts/prepare-github-pages.js

      - name: Validate /docs publication output
        run: python scripts/validate-docs-published-output.py
        env:
          DOCS_VALIDATION_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}

      - name: Test VIGIL Observatory
        run: pnpm run test:vigil
