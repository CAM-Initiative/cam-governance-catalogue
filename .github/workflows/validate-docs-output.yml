name: Validate published docs output

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate-docs-output:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Restore and update Observatory test contract
        if: github.event_name == 'pull_request'
        run: |
          git cat-file blob c89deb3550ba20e5ac5681e4b35179005def6928 > scripts/test-vigil-observatory.mjs
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/test-vigil-observatory.mjs')
          text = path.read_text(encoding='utf-8')
          old = '  assert.match(report, /chain\\.patches\\.length > 0/);'
          new = '  assert.match(report, /function reportSectionAvailability/);\n  assert.match(report, /Object\\.values\\(availability\\)\\.every\\(Boolean\\)/);'
          if text.count(old) != 1:
              raise SystemExit(f'Expected one obsolete completion assertion, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/test-vigil-observatory.mjs
          git commit -m "Align Observatory tests with six-section completion"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate CAM website palette
        run: pnpm run validate:palette

      - name: Test VIGIL Knowledge Base contract
        run: pnpm run test:knowledge-base

      - name: Compile website source
        run: pnpm exec vite build

      - name: Prepare GitHub Pages routes
        run: node scripts/prepare-github-pages.js

      - name: Validate /docs publication output
        run: python scripts/validate-docs-published-output.py
        env:
          DOCS_VALIDATION_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}

      - name: Test VIGIL Observatory
        run: pnpm run test:vigil
