name: Validate published docs output

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-docs-output:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate CAM website palette
        run: pnpm run validate:palette

      - name: Test VIGIL Knowledge Base contract
        run: pnpm run test:knowledge-base

      - name: Compile website source
        run: pnpm exec vite build

      - name: Prepare GitHub Pages routes
        run: node scripts/prepare-github-pages.js

      - name: Validate /docs publication output
        run: python scripts/validate-docs-published-output.py
        env:
          DOCS_VALIDATION_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}

      - name: Run VIGIL Observatory suite
        id: vigil_suite
        continue-on-error: true
        run: pnpm run test:vigil > vigil-observatory-test.log 2>&1

      - name: Upload VIGIL Observatory diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vigil-observatory-test-diagnostics
          path: vigil-observatory-test.log
          if-no-files-found: error
          retention-days: 3

      - name: Enforce VIGIL Observatory suite
        if: steps.vigil_suite.outcome == 'failure'
        run: |
          tail -n 100 vigil-observatory-test.log
          exit 1
