name: Normalize Legal Attribution

on:
  push:
    branches: ["agent/case-reference-bibliography-fix"]
    paths:
      - ".github/LEGAL-ATTRIBUTION-NORMALIZATION.md"

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize obsolete organisational attribution
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          candidates = [Path("src"), Path("README.md"), Path("replit.md"), Path("LICENSE.md"), Path("CITATION.cff"), Path("VIGIL-PUBLIC-DISPLAY-CONTRACT.md")]
          files = []
          for candidate in candidates:
              if candidate.is_dir():
                  files.extend(p for p in candidate.rglob("*") if p.is_file() and p.suffix.lower() in {".ts", ".tsx", ".js", ".md", ".json", ".cff", ".css"})
              elif candidate.is_file():
                  files.append(candidate)

          replacements = [
              ("CAM Initiative. VIGIL: Evidence-to-Repair Governance Ledger. Maintained by Aeon Governance Lab. 2026.", "Dr Michelle O'Rourke. VIGIL: Evidence-to-Repair Governance Ledger. 2026."),
              ("CAM Initiative. CAM Initiative public governance infrastructure. Maintained by Aeon Governance Lab. 2026.", "Dr Michelle O'Rourke. CAM Initiative public governance infrastructure. 2026."),
              ("Maintained by Aeon Governance Lab.", "Maintained by Dr Michelle O'Rourke."),
              ('maintainer: "Aeon Governance Lab"', 'maintainer: "Dr Michelle O\'Rourke"'),
              ("Aeon Governance Lab / CAM Initiative", "Dr Michelle O'Rourke"),
              ("© Aeon Governance Lab / CAM Initiative", "© Dr Michelle O'Rourke"),
              ("© 2026 Aeon Governance Lab", "© 2026 Dr Michelle O'Rourke"),
          ]

          changed = []
          for path in sorted(set(files)):
              original = path.read_text(encoding="utf-8")
              updated = original
              for old, new in replacements:
                  updated = updated.replace(old, new)
              if updated != original:
                  path.write_text(updated, encoding="utf-8")
                  changed.append(path.as_posix())
          print(f"Normalized legal attribution in {len(changed)} files")
          for path in changed:
              print(path)
          PY

      - name: Commit normalized attribution
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No attribution changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src README.md replit.md LICENSE.md CITATION.cff VIGIL-PUBLIC-DISPLAY-CONTRACT.md
          git commit -m "Normalize catalogue legal attribution to Dr Michelle O'Rourke"
          git push origin HEAD:"${GITHUB_REF_NAME}"
